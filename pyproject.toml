# D:\Files\gitProjects\lumerical-mcp\pyproject.toml
[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lumerical-mcp"
version = "0.1.1"
description = "MCP server for Lumerical FDTD automation"
readme = "README.md"
license = "MIT"
authors = [{name = "Saku1234", email = "lxh875410020@gmail.com"}]
maintainers = [{name = "Saku1234", email = "lxh875410020@gmail.com"}]
keywords = ["mcp", "lumerical", "fdtd", "photonics", "simulation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
]
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.10.0,<2.0.0",
    "numpy",
    "packaging",
]

[project.urls]
Homepage = "https://github.com/saku123hh/lumerical-mcp"
Repository = "https://github.com/saku123hh/lumerical-mcp"
Issues = "https://github.com/saku123hh/lumerical-mcp/issues"

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
"lumerical-mcp" = "lumerical_mcp.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["lumerical_mcp*"]

[tool.ruff]
line-length = 100
target-version = "py310"